<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adopta un Gatito</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main>

        <div class="tarjeta">

            <div class="portada"></div>

             <h1 id="titulo">
                Adopta un Gatito
            </h1>

            <p id="parrafo">
                Adoptar un gatito es una oportunidad para cambiar
                su vida y recibir a cambio una hermosa compañía.
            </p>

            <h3>Beneficios de adoptar:</h3>

            <ul>
                <li>Brindas un hogar a un gatito.</li>
                <li>Ayudas a reducir el abandono animal.</li>
                <li>Obtienes un compañero lleno de cariño.</li>
            </ul>

            <button class="boton">
                Adoptar
            </button>

        </div>

    </main>

</body>
</html>
